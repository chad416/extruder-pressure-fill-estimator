name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - name: Unit tests and SCL equivalence (float32 Real)
        run: python -m pytest -q
      - name: SCL sources translate (the TIA build itself needs Windows + TIA Portal)
        run: python -c "import glob; from xtrude import scl; print(list(scl.load(sorted(glob.glob('plc/FB_*.scl')))))"
